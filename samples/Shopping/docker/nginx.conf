# Two instances of each host behind one address each (docs/guides/several-instances.md):
# - port 8080 (5080 on the host), the REST API and the WebAssembly app: an API client with a remote transaction stays
#   on one instance, hashed on X-Client-Id; requests without it (static files, sign-in) go to any instance;
# - port 8090 (5090 on the host), Blazor Server: a browser stays on one instance, which holds its circuit, hashed on a
#   cookie set here on its first response;
# - /api/auth is limited per client address here, for every instance together (the instances' own limit is off).
# X-Upstream tells which instance answered: the compose check reads it.

map $http_x_client_id $api_affinity {
    ""       $request_id;
    default  $http_x_client_id;
}

# The first response sets the cookie to the value it was hashed on, so the next requests hash to the same instance.
map $cookie_shopping_node $blazor_affinity {
    ""       $request_id;
    default  $cookie_shopping_node;
}

map $http_upgrade $connection_upgrade {
    default  upgrade;
    ""       close;
}

limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;

upstream shopping_server {
    hash $api_affinity consistent;
    server server-a:8080;
    server server-b:8080;
}

upstream shopping_blazor {
    hash $blazor_affinity consistent;
    server blazor-a:8080;
    server blazor-b:8080;
}

server {
    listen 8080;
    add_header X-Upstream $upstream_addr always;

    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://shopping_server;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://shopping_server;
        proxy_set_header Host $host;
    }
}

server {
    listen 8090;
    add_header X-Upstream $upstream_addr always;
    add_header Set-Cookie "shopping_node=$blazor_affinity; Path=/; HttpOnly; SameSite=Lax" always;

    location / {
        proxy_pass http://shopping_blazor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
