# The Shopping demo with two instances of each web host: PostgreSQL, the REST API (with the WebAssembly app) and Blazor
# Server, nginx in front of each pair, and Prometheus receiving the metrics over OTLP. See README.md.
name: wdc-shopping

x-host: &host
  environment:
    Shopping__Database__Provider: PostgreSql
    Shopping__Database__ConnectionString: Host=postgres;Database=shopping;Username=shopping;Password=${SHOPPING_DB_PASSWORD:?set it in .env}
    Shopping__Database__Schema: shopping
    Shopping__Jwt__Key: ${SHOPPING_JWT_KEY:?set it in .env}
    Shopping__History__Key: ${SHOPPING_HISTORY_KEY:?set it in .env}
    # nginx limits /api/auth per client address, for every instance together
    Shopping__Auth__RequestsPerMinute: "0"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://prometheus:9090/api/v1/otlp
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_METRIC_EXPORT_INTERVAL: "5000"
  healthcheck:
    # the image has no curl: a plain HTTP request from bash
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s
  restart: unless-stopped

x-server: &server
  <<: *host
  build:
    context: ../../..
    dockerfile: samples/Shopping/docker/Dockerfile
    target: server
  image: wdc-shopping-server:local

x-blazor: &blazor
  <<: *host
  build:
    context: ../../..
    dockerfile: samples/Shopping/docker/Dockerfile
    target: blazor
  image: wdc-shopping-blazor:local

services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_DB: shopping
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: ${SHOPPING_DB_PASSWORD:?set it in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping"]
      interval: 3s
      timeout: 3s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-otlp-receiver"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  # the first instance creates the tables and loads the demo data on an empty database; the others wait for it
  server-a:
    <<: *server
    hostname: server-a
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["5081:8080"]

  server-b:
    <<: *server
    hostname: server-b
    depends_on:
      server-a: { condition: service_healthy }
    ports: ["5082:8080"]

  blazor-a:
    <<: *blazor
    hostname: blazor-a
    depends_on:
      server-a: { condition: service_healthy }
    ports: ["5091:8080"]

  blazor-b:
    <<: *blazor
    hostname: blazor-b
    depends_on:
      blazor-a: { condition: service_healthy }
    ports: ["5092:8080"]

  nginx:
    image: nginx:1.30.6
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server-a: { condition: service_healthy }
      server-b: { condition: service_healthy }
      blazor-a: { condition: service_healthy }
      blazor-b: { condition: service_healthy }
    ports: ["5080:8080", "5090:8090"]

volumes:
  postgres-data:
