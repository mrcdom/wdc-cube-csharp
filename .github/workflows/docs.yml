name: Docs

# Builds the documentation site (docs/ plus the API reference of src/) with docfx on every pull request that touches
# it, and publishes it to GitHub Pages from main.

on:
  push:
    branches: [main]
    paths: ["docs/**", "src/**", "dotnet-tools.json", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "src/**", "dotnet-tools.json", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - run: dotnet tool restore

      - name: Build the site
        run: dotnet tool run docfx docs/docfx.json

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
