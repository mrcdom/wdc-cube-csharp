name: Publish

# Publishes the packages of src/ to nuget.org when a version tag is pushed (v0.1.0, v0.2.0-beta.1...), after the
# whole CI suite passes on that commit. nuget.org trusts this workflow through OIDC (trusted publishing): no API key
# is stored in the repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nuget # approvals and the nuget.org user live in this environment
    permissions:
      contents: read
      id-token: write # the OIDC token nuget.org exchanges for a short-lived key
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Pack
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release -p:Version="$VERSION" -o out
          done

      - name: Check the packages from a project outside the repository
        run: scripts/check-packages.sh out "$VERSION"

      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: >-
          dotnet nuget push "out/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
