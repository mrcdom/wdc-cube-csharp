name: Bug report
description: Something in a Wdc package or a sample does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        A security problem? Do not open an issue: report it privately (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Package and version
      description: The package and its version, or the commit of main.
      placeholder: Wdc.Cube 0.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: .NET version, renderer (Blazor Server, Blazor WebAssembly, Avalonia), database, OS.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest code or steps that show it. A failing test is best.
    validations:
      required: true
